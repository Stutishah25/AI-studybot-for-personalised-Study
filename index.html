      // Gracefully silence transient Vite WebSocket errors in preview iframe
      window.addEventListener('unhandledrejection', function (e) {
        if (
          e &&
          e.reason &&

            String(e.reason).includes('WebSocket'))
        ) {
          e.preventDefault();
        }
      });
